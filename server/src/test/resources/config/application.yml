# Test-only overrides, merged on top of src/main/resources/application.yml
# (Spring Boot loads classpath:/config/application.yml after classpath:/application.yml).
wedelivery:
  simulation:
    # The background tick would advance orders and vehicles while a test is
    # asserting on them; tests that need a tick call SimulationService.tick().
    auto-tick: false
  routing:
    # Tests must never call the public OSRM demo server: it would make the suite
    # depend on the network and on third-party rate limits. Use the offline
    # straight-line provider instead so distance assertions stay deterministic.
    provider: haversine
