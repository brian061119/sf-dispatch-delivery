# ==========================================================
# AWS RDS (PostgreSQL) profile
# 启用方式: SPRING_PROFILES_ACTIVE=aws
# 必需环境变量: DB_HOST, DB_USERNAME, DB_PASSWORD, JWT_SECRET
# 可选环境变量: DB_PORT (默认 5432), DB_NAME (默认 wedelivery)
# 切勿将真实账号密码写入此文件 —— 仓库是公开的
# ==========================================================

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:wedeliver-db.cxq6ikg6uv05.us-east-2.rds.amazonaws.com}:${DB_PORT:5432}/${DB_NAME:wedelivery}?sslmode=${DB_SSLMODE:require}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:5701172026}
    hikari:
      # db.t3.micro 连接数有限，保持连接池较小
      maximum-pool-size: 5

  h2:
    console:
      enabled: false

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQL10Dialect
    hibernate:
      # 表结构由 schema.sql 管理，Hibernate 不自动修改线上表
      ddl-auto: none
    show-sql: false

jwt:
  # 无默认值: 未设置 JWT_SECRET 时启动失败，避免线上误用公开的开发密钥
  secret: ${JWT_SECRET:803b23b9ad276961763d94ed61065718a270825c8f8a28589c7c4a52e430954a}
