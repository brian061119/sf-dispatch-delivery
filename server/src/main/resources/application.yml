server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: sf-dispatch-delivery-server

  datasource:
    # 默认使用 H2 内存库便于极速零配置启动测试；如需切换 MySQL，取消注释下方的 MySQL 配置
    url: jdbc:h2:mem:wedelivery;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
    # MySQL 生产/外部 RDS 配置示例:
    # url: jdbc:mysql://localhost:3306/wedelivery?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    # driver-class-name: com.mysql.cj.jdbc.Driver
    # username: root
    # password: your_password

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    # 若使用 MySQL 切换为: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

# JWT 鉴权配置
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expirationMs: 86400000 # 24 小时有效
