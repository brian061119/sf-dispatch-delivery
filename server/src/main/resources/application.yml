server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: sf-dispatch-delivery-server

  datasource:
    # 默认使用 H2 内存库便于极速零配置启动测试
    # 连接 AWS RDS (PostgreSQL) 请使用 aws profile: SPRING_PROFILES_ACTIVE=aws，见 application-aws.yml
    url: jdbc:h2:mem:wedelivery;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

# JWT 鉴权配置
jwt:
  # 本地开发默认值；aws profile 中必须通过环境变量 JWT_SECRET 提供
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expirationMs: ${JWT_EXPIRATION_MS:86400000} # 24 小时有效
