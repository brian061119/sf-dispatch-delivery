server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: sf-dispatch-delivery-server

  datasource:
    # 默认使用 H2 内存库便于极速零配置启动测试
    # 连接 AWS RDS (PostgreSQL) 请使用 aws profile: SPRING_PROFILES_ACTIVE=aws，见 application-aws.yml
    url: jdbc:h2:mem:wedelivery;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

# JWT 鉴权配置
jwt:
  # 本地开发默认值；aws profile 中必须通过环境变量 JWT_SECRET 提供
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expirationMs: ${JWT_EXPIRATION_MS:86400000} # 24 小时有效

# demo 模拟器定时推进（SimulationScheduler）
wedelivery:
  ai:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.8-flash}
    base-url: https://generativelanguage.googleapis.com/v1beta
  simulation:
    auto-tick: ${SIMULATION_AUTO_TICK:true}
    tick-ms: ${SIMULATION_TICK_MS:10000}
  routing:
    # osrm     = 接真实路网（公共 OSRM demo 服务器，免费无需 key），地面机器人沿街道行驶
    # haversine = 纯直线估算（离线可用，机器人会横穿房屋）
    # OSRM 请求失败/超时会自动退回直线，不会让下单或追踪报错。
    provider: ${ROUTING_PROVIDER:osrm}
    osrm-base-url: ${OSRM_BASE_URL:https://router.project-osrm.org}
    enabled: ${ROUTING_ENABLED:true}

