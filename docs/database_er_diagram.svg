<svg width="1180" height="680" viewBox="0 0 1180 680" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4B5563"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="30" y="34" font-size="20" font-weight="bold" fill="#1F2937">WeDelivery 数据库实体关系模型 (ER Diagram)</text>
  <text x="30" y="54" font-size="12" fill="#6B7280">8 张核心业务数据表与主外键关联拓扑（PostgreSQL / H2 兼容，含公开追踪码、一键升级、评价、密码重置与实时遥测字段）</text>

  <!-- ==================== LEFT COLUMN ==================== -->

  <!-- 1. USERS Table -->
  <g transform="translate(30, 75)" filter="url(#shadow)">
    <rect width="275" height="190" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
    <path d="M 0 8 Q 0 0 8 0 L 267 0 Q 275 0 275 8 L 275 32 L 0 32 Z" fill="#EFF6FF"/>
    <text x="12" y="21" font-size="13.5" font-weight="bold" fill="#1D4ED8">users (用户与会员表)</text>
    <text x="12" y="50" font-size="11.5" fill="#1F2937"><tspan font-weight="bold" fill="#D97706">PK </tspan>id : BIGINT</text>
    <text x="12" y="69" font-size="11.5" fill="#1F2937"><tspan font-weight="bold" fill="#059669">UK </tspan>username : VARCHAR(64)</text>
    <text x="12" y="88" font-size="11.5" fill="#4B5563">password_hash : VARCHAR(255) (BCrypt)</text>
    <text x="12" y="107" font-size="11.5" fill="#1F2937"><tspan font-weight="bold" fill="#059669">UK </tspan>email : VARCHAR(128)</text>
    <text x="12" y="126" font-size="11.5" fill="#4B5563">first_name, last_name : VARCHAR(64)</text>
    <text x="12" y="145" font-size="11.5" fill="#2563EB">role : VARCHAR(20) (USER / VIP / ADMIN)</text>
    <text x="12" y="164" font-size="11.5" fill="#6B7280">vip_expire_at : TIMESTAMP</text>
    <text x="12" y="181" font-size="11" fill="#6B7280">created_at, updated_at : TIMESTAMP</text>
  </g>

  <!-- 2. PASSWORD_RESET_TOKENS Table -->
  <g transform="translate(30, 295)" filter="url(#shadow)">
    <rect width="275" height="135" rx="8" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2"/>
    <path d="M 0 8 Q 0 0 8 0 L 267 0 Q 275 0 275 8 L 275 32 L 0 32 Z" fill="#ECFEFF"/>
    <text x="12" y="21" font-size="13" font-weight="bold" fill="#0E7490">password_reset_tokens (重置令牌)</text>
    <text x="12" y="50" font-size="11.5" fill="#1F2937"><tspan font-weight="bold" fill="#D97706">PK </tspan>id : BIGINT</text>
    <text x="12" y="69" font-size="11.5" fill="#2563EB"><tspan font-weight="bold" fill="#DC2626">FK </tspan>user_id -&gt; users.id</text>
    <text x="12" y="88" font-size="11.5" fill="#1F2937"><tspan font-weight="bold" fill="#059669">UK </tspan>token_hash : VARCHAR(64) (SHA-256)</text>
    <text x="12" y="107" font-size="11.5" fill="#4B5563">expires_at, used_at : TIMESTAMP</text>
    <text x="12" y="124" font-size="11" fill="#6B7280">created_at : TIMESTAMP (30m 一次性有效)</text>
  </g>

  <!-- 3. STATIONS Table -->
  <g transform="translate(30, 460)" filter="url(#shadow)">
    <rect width="275" height="175" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <path d="M 0 8 Q 0 0 8 0 L 267 0 Q 275 0 275 8 L 275 32 L 0 32 Z" fill="#ECFDF5"/>
    <text x="12" y="21" font-size="13.5" font-weight="bold" fill="#047857">stations (3个分配中心站)</text>
    <text x="12" y="50" font-size="11.5" fill="#1F2937"><tspan font-weight="bold" fill="#D97706">PK </tspan>id : BIGINT (1, 2, 3)</text>
    <text x="12" y="69" font-size="11.5" fill="#1F2937"><tspan font-weight="bold" fill="#059669">UK </tspan>name : VARCHAR(100)</text>
    <text x="12" y="88" font-size="11.5" fill="#4B5563">address : VARCHAR(255)</text>
    <text x="12" y="107" font-size="11.5" fill="#2563EB">latitude, longitude : DECIMAL(10,7)</text>
    <text x="12" y="126" font-size="11.5" fill="#4B5563">total_drone_bays : INT (默认 10)</text>
    <text x="12" y="145" font-size="11.5" fill="#4B5563">total_robot_bays : INT (默认 15)</text>
    <text x="12" y="164" font-size="11" fill="#6B7280">contact_phone : VARCHAR(32)</text>
  </g>

  <!-- ==================== CENTER COLUMN ==================== -->

  <!-- 4. ORDERS Table -->
  <g transform="translate(375, 75)" filter="url(#shadow)">
    <rect width="315" height="535" rx="8" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2"/>
    <path d="M 0 8 Q 0 0 8 0 L 307 0 Q 315 0 315 8 L 315 32 L 0 32 Z" fill="#F5F3FF"/>
    <text x="12" y="21" font-size="13.5" font-weight="bold" fill="#6D28D9">orders (核心配送订单表)</text>
    <text x="12" y="50" font-size="11.5" fill="#1F2937"><tspan font-weight="bold" fill="#D97706">PK </tspan>id : BIGINT</text>
    <text x="12" y="69" font-size="11.5" fill="#1F2937"><tspan font-weight="bold" fill="#059669">UK </tspan>order_number : VARCHAR(64)</text>
    <text x="12" y="88" font-size="11.5" fill="#1F2937"><tspan font-weight="bold" fill="#059669">UK </tspan>tracking_code : VARCHAR(32) (公开免密追踪码)</text>
    <text x="12" y="107" font-size="11.5" fill="#2563EB"><tspan font-weight="bold" fill="#DC2626">FK </tspan>user_id -&gt; users.id</text>
    <text x="12" y="126" font-size="11.5" fill="#2563EB"><tspan font-weight="bold" fill="#DC2626">FK </tspan>station_id -&gt; stations.id (始发站点)</text>
    <text x="12" y="145" font-size="11.5" fill="#2563EB"><tspan font-weight="bold" fill="#DC2626">FK </tspan>vehicle_id -&gt; vehicles.id (支持中途升级换绑)</text>
    <text x="12" y="164" font-size="11.5" fill="#4B5563">return_station_id : BIGINT (完单/取消就近返航站)</text>
    <text x="12" y="183" font-size="11.5" fill="#4B5563">vehicle_type : DRONE / ROBOT</text>
    <text x="12" y="202" font-size="11.5" fill="#D97706">plan_type : FASTEST / BEST_VALUE / OFF_PEAK</text>
    <text x="12" y="221" font-size="11.5" fill="#D97706">status : PENDING_PAYMENT / PAID / IN_TRANSIT /</text>
    <text x="54" y="237" font-size="11" fill="#D97706">DELIVERED / CANCELLED</text>
    <text x="12" y="256" font-size="11.5" fill="#4B5563">is_station_pickup : BOOLEAN</text>
    <text x="12" y="275" font-size="11.5" fill="#4B5563">pickup_address, pickup_lat, pickup_lng</text>
    <text x="12" y="294" font-size="11.5" fill="#4B5563">dropoff_address, dropoff_lat, dropoff_lng</text>
    <text x="12" y="313" font-size="11.5" fill="#4B5563">package_weight (kg), package_volume (m³)</text>
    <text x="12" y="332" font-size="11.5" fill="#4B5563">total_distance (km) : DECIMAL(8,2)</text>
    <text x="12" y="351" font-size="11.5" fill="#10B981">origin_price, discount_amount : DECIMAL(10,2)</text>
    <text x="12" y="370" font-size="11.5" fill="#10B981"><tspan font-weight="bold">final_price</tspan> : DECIMAL(10,2)</text>
    <text x="12" y="389" font-size="11.5" fill="#4B5563">cancellation_fee, refund_amount : DECIMAL(10,2)</text>
    <text x="12" y="408" font-size="11.5" fill="#2563EB">has_been_modified : BOOLEAN</text>
    <text x="12" y="427" font-size="11.5" fill="#2563EB">modified_count : INT (普通≤1次, VIP≤2次)</text>
    <text x="12" y="446" font-size="11" fill="#6B7280">scheduled_start_time : TIMESTAMP</text>
    <text x="12" y="465" font-size="11" fill="#6B7280">estimated_delivery_time : TIMESTAMP</text>
    <text x="12" y="484" font-size="11" fill="#6B7280">actual_delivery_time : TIMESTAMP</text>
    <text x="12" y="503" font-size="11" fill="#6B7280">created_at : TIMESTAMP</text>
    <text x="12" y="522" font-size="10.5" fill="#9CA3AF">@Transient: droneUpgradeAvailable, maxModificationsAllowed</text>
  </g>

  <!-- ==================== RIGHT COLUMN ==================== -->

  <!-- 5. PAYMENTS Table -->
  <g transform="translate(760, 75)" filter="url(#shadow)">
    <rect width="390" height="125" rx="8" fill="#FFFFFF" stroke="#EC4899" stroke-width="2"/>
    <path d="M 0 8 Q 0 0 8 0 L 382 0 Q 390 0 390 8 L 390 30 L 0 30 Z" fill="#FDF2F8"/>
    <text x="12" y="20" font-size="13" font-weight="bold" fill="#BE185D">payments (Mock 支付与差价结算流水表)</text>
    <text x="12" y="47" font-size="11.5" fill="#1F2937"><tspan font-weight="bold" fill="#D97706">PK </tspan>id : BIGINT   |   <tspan font-weight="bold" fill="#059669">UK </tspan>transaction_no : VARCHAR(64)</text>
    <text x="12" y="65" font-size="11.5" fill="#2563EB"><tspan font-weight="bold" fill="#DC2626">FK/UK </tspan>order_id -&gt; orders.id (1:1)   |   <tspan font-weight="bold" fill="#DC2626">FK </tspan>user_id -&gt; users.id</text>
    <text x="12" y="83" font-size="11.5" fill="#10B981">amount : DECIMAL(10,2)   |   payment_method : MOCK_CARD</text>
    <text x="12" y="101" font-size="11.5" fill="#4B5563">status : SUCCESS / FAILED   |   failure_code : VARCHAR(64)</text>
    <text x="12" y="117" font-size="11" fill="#6B7280">paid_at : TIMESTAMP (支持改址/升级无人机差价更新)</text>
  </g>

  <!-- 6. ORDER_REVIEWS Table -->
  <g transform="translate(760, 215)" filter="url(#shadow)">
    <rect width="390" height="120" rx="8" fill="#FFFFFF" stroke="#F43F5E" stroke-width="2"/>
    <path d="M 0 8 Q 0 0 8 0 L 382 0 Q 390 0 390 8 L 390 30 L 0 30 Z" fill="#FFF1F2"/>
    <text x="12" y="20" font-size="13" font-weight="bold" fill="#BE123C">order_reviews (订单星级评价与破损反馈表)</text>
    <text x="12" y="47" font-size="11.5" fill="#1F2937"><tspan font-weight="bold" fill="#D97706">PK </tspan>id : BIGINT   |   <tspan font-weight="bold" fill="#059669">UK </tspan>review_code : VARCHAR(64)</text>
    <text x="12" y="65" font-size="11.5" fill="#2563EB"><tspan font-weight="bold" fill="#DC2626">FK/UK </tspan>order_id -&gt; orders.id (1:1)   |   <tspan font-weight="bold" fill="#DC2626">FK </tspan>user_id -&gt; users.id</text>
    <text x="12" y="83" font-size="11.5" fill="#D97706">rating : INT (1~5 星)   |   damage_reported : BOOLEAN</text>
    <text x="12" y="101" font-size="11.5" fill="#4B5563">order_number : VARCHAR(64)   |   comment : VARCHAR(1000)</text>
    <text x="12" y="115" font-size="11" fill="#6B7280">created_at : TIMESTAMP (确认收货后可提交)</text>
  </g>

  <!-- 7. TRACKING_EVENTS Table -->
  <g transform="translate(760, 350)" filter="url(#shadow)">
    <rect width="390" height="115" rx="8" fill="#FFFFFF" stroke="#6366F1" stroke-width="2"/>
    <path d="M 0 8 Q 0 0 8 0 L 382 0 Q 390 0 390 8 L 390 30 L 0 30 Z" fill="#EEF2FF"/>
    <text x="12" y="20" font-size="13" font-weight="bold" fill="#4338CA">tracking_events (轨迹里程碑与操作事件审计表)</text>
    <text x="12" y="47" font-size="11.5" fill="#1F2937"><tspan font-weight="bold" fill="#D97706">PK </tspan>id : BIGINT   |   <tspan font-weight="bold" fill="#DC2626">FK </tspan><tspan fill="#2563EB">order_id -&gt; orders.id (1:N)</tspan></text>
    <text x="12" y="65" font-size="11" fill="#D97706">stage : TO_PICKUP / TO_DROPOFF / RETURNING / COMPLETED /</text>
    <text x="48" y="80" font-size="11" fill="#D97706">ORDER_UPDATED / DELIVERY_CONFIRMED / CANCELLED</text>
    <text x="12" y="96" font-size="11.5" fill="#4B5563">status_description : VARCHAR(255)   |   event_lat, event_lng</text>
    <text x="12" y="110" font-size="11" fill="#6B7280">event_time : TIMESTAMP</text>
  </g>

  <!-- 8. VEHICLES Table -->
  <g transform="translate(760, 480)" filter="url(#shadow)">
    <rect width="390" height="155" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <path d="M 0 8 Q 0 0 8 0 L 382 0 Q 390 0 390 8 L 390 30 L 0 30 Z" fill="#FEF3C7"/>
    <text x="12" y="20" font-size="13" font-weight="bold" fill="#B45309">vehicles (无人机与地面机器人实时状态表)</text>
    <text x="12" y="46" font-size="11.5" fill="#1F2937"><tspan font-weight="bold" fill="#D97706">PK </tspan>id : BIGINT   |   <tspan font-weight="bold" fill="#059669">UK </tspan>vehicle_code : VARCHAR(32)</text>
    <text x="12" y="64" font-size="11.5" fill="#2563EB"><tspan font-weight="bold" fill="#DC2626">FK </tspan>station_id -&gt; stations.id   |   target_station_id : BIGINT</text>
    <text x="12" y="82" font-size="11.5" fill="#D97706">vehicle_type : DRONE / ROBOT   |   status : IDLE / IN_DELIVERY / CHARGING / OFFLINE</text>
    <text x="12" y="100" font-size="11.5" fill="#10B981">battery_level (0~100%)   |   endurance_minutes (30m / 240m)</text>
    <text x="12" y="118" font-size="11.5" fill="#4B5563">max_weight, max_volume, cruise_speed, current_speed (km/h)</text>
    <text x="12" y="135" font-size="11" fill="#2563EB">location_code (0=在途, 1/2/3=停靠站)   |   current_lat, current_lng</text>
    <text x="12" y="149" font-size="10.5" fill="#6B7280">position_updated_at, status_updated_at, speed_updated_at, updated_at</text>
  </g>

  <!-- ==================== CONNECTORS ==================== -->

  <!-- users -> orders (1:N) -->
  <path d="M 305 150 L 375 150" fill="none" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="323" y="142" font-size="11" font-weight="bold" fill="#4B5563">1 : N</text>

  <!-- users -> password_reset_tokens (1:N) -->
  <path d="M 167 265 L 167 295" fill="none" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="175" y="284" font-size="11" font-weight="bold" fill="#4B5563">1 : N</text>

  <!-- stations -> orders (1:N) -->
  <path d="M 305 530 L 375 530" fill="none" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="323" y="522" font-size="11" font-weight="bold" fill="#4B5563">1 : N</text>

  <!-- orders -> payments (1:1) -->
  <path d="M 690 135 L 760 135" fill="none" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="708" y="127" font-size="11" font-weight="bold" fill="#4B5563">1 : 1</text>

  <!-- orders -> order_reviews (1:1) -->
  <path d="M 690 275 L 760 275" fill="none" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="708" y="267" font-size="11" font-weight="bold" fill="#4B5563">1 : 1</text>

  <!-- orders -> tracking_events (1:N) -->
  <path d="M 690 408 L 760 408" fill="none" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="708" y="400" font-size="11" font-weight="bold" fill="#4B5563">1 : N</text>

  <!-- vehicles -> orders (1:N) -->
  <path d="M 760 555 L 690 555" fill="none" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="708" y="547" font-size="11" font-weight="bold" fill="#4B5563">1 : N</text>

  <!-- stations -> vehicles (1:N bottom dashed line) -->
  <path d="M 167 635 L 167 656 L 955 656 L 955 635" fill="none" stroke="#4B5563" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="480" y="672" font-size="11.5" font-weight="bold" fill="#4B5563">stations 拥有并管理多辆 vehicles (1 : N)</text>
</svg>