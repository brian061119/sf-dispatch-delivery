<svg width="1120" height="920" viewBox="0 0 1120 920" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1E3A8A"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4B5563"/>
    </marker>
  </defs>

  <!-- 1. 客户端层 (Web Client) -->
  <rect x="40" y="25" width="1040" height="110" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <rect x="40" y="25" width="1040" height="26" rx="4" fill="#F3F4F6" stroke="#333333" stroke-width="1.5"/>
  <text x="560" y="42" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">客户端层 (Web Client)</text>

  <!-- 用户端 -->
  <rect x="70" y="60" width="460" height="65" rx="3" fill="#FFFFFF" stroke="#6B7280" stroke-width="1"/>
  <text x="300" y="80" font-size="12" font-weight="bold" fill="#111827" text-anchor="middle">用户端 (User/VIP View)</text>
  <text x="300" y="98" font-size="11" fill="#4B5563" text-anchor="middle">- 询价/推荐对比   - 下单与支付</text>
  <text x="300" y="114" font-size="11" fill="#4B5563" text-anchor="middle">- 实时地图轨迹追踪</text>

  <!-- 管理端 -->
  <rect x="570" y="60" width="480" height="65" rx="3" fill="#FFFFFF" stroke="#6B7280" stroke-width="1"/>
  <text x="810" y="80" font-size="12" font-weight="bold" fill="#111827" text-anchor="middle">管理端 (Admin/Station View)</text>
  <text x="810" y="98" font-size="11" fill="#4B5563" text-anchor="middle">- 3个站点运营看板   - 载具状态/电量监控</text>
  <text x="810" y="114" font-size="11" fill="#4B5563" text-anchor="middle">- 全城订单热力/列表</text>

  <!-- 客户端 -> 安全鉴权层 -->
  <line x1="560" y1="135" x2="560" y2="165" stroke="#1E3A8A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. 安全鉴权层 -->
  <rect x="40" y="165" width="1040" height="70" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <rect x="40" y="165" width="1040" height="24" rx="4" fill="#F3F4F6" stroke="#333333" stroke-width="1.5"/>
  <text x="560" y="181" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">安全鉴权层</text>

  <rect x="150" y="196" width="360" height="32" rx="3" fill="#FFFFFF" stroke="#6B7280" stroke-width="1"/>
  <text x="330" y="217" font-size="12" fill="#111827" text-anchor="middle">Spring Security Filter Chain</text>

  <rect x="590" y="196" width="380" height="32" rx="3" fill="#FFFFFF" stroke="#6B7280" stroke-width="1"/>
  <text x="780" y="217" font-size="12" fill="#111827" text-anchor="middle">JWT Provider / AuthInterceptor</text>

  <!-- 安全鉴权层 -> 控制器层 -->
  <line x1="560" y1="235" x2="560" y2="265" stroke="#1E3A8A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3. 控制器层 (REST Controllers) -->
  <rect x="40" y="265" width="1040" height="85" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <rect x="40" y="265" width="1040" height="24" rx="4" fill="#F3F4F6" stroke="#333333" stroke-width="1.5"/>
  <text x="560" y="281" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">控制器层 (REST Controllers)</text>

  <!-- 5 Controllers -->
  <!-- AdminStationController: center x = 145 -->
  <rect x="60" y="297" width="170" height="42" rx="3" fill="#FFFFFF" stroke="#6B7280" stroke-width="1"/>
  <text x="145" y="314" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">AdminStationController</text>
  <text x="145" y="330" font-size="10" fill="#4B5563" text-anchor="middle">(/api/admin)</text>

  <!-- RecommendationController: center x = 345 -->
  <rect x="250" y="297" width="190" height="42" rx="3" fill="#FFFFFF" stroke="#6B7280" stroke-width="1"/>
  <text x="345" y="314" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">RecommendationController</text>
  <text x="345" y="330" font-size="10" fill="#4B5563" text-anchor="middle">(/api/recommendations)</text>

  <!-- TrackingController: center x = 555 -->
  <rect x="460" y="297" width="170" height="42" rx="3" fill="#FFFFFF" stroke="#6B7280" stroke-width="1"/>
  <text x="545" y="314" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">TrackingController</text>
  <text x="545" y="330" font-size="10" fill="#4B5563" text-anchor="middle">(/api/tracking)</text>

  <!-- OrderController: center x = 745 -->
  <rect x="650" y="297" width="170" height="42" rx="3" fill="#FFFFFF" stroke="#6B7280" stroke-width="1"/>
  <text x="735" y="314" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">OrderController</text>
  <text x="735" y="330" font-size="10" fill="#4B5563" text-anchor="middle">(/api/orders)</text>

  <!-- AuthController: center x = 935 -->
  <rect x="840" y="297" width="160" height="42" rx="3" fill="#FFFFFF" stroke="#6B7280" stroke-width="1"/>
  <text x="920" y="314" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">AuthController</text>
  <text x="920" y="330" font-size="10" fill="#4B5563" text-anchor="middle">(/api/auth)</text>

  <!-- 4. 业务逻辑层 (Services) -->
  <rect x="40" y="380" width="1040" height="205" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <rect x="40" y="380" width="1040" height="24" rx="4" fill="#F3F4F6" stroke="#333333" stroke-width="1.5"/>
  <text x="560" y="396" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">业务逻辑层 (Services)</text>

  <!-- AdminStationService -->
  <rect x="55" y="415" width="160" height="50" rx="3" fill="#FFFFFF" stroke="#6B7280" stroke-width="1"/>
  <text x="135" y="435" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">AdminStationService</text>
  <text x="135" y="453" font-size="10" fill="#4B5563" text-anchor="middle">- 站点车队状态聚合统计</text>

  <!-- RecommendationService -->
  <rect x="230" y="415" width="200" height="58" rx="3" fill="#FFFFFF" stroke="#6B7280" stroke-width="1"/>
  <text x="330" y="432" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">RecommendationService</text>
  <text x="330" y="447" font-size="9.5" fill="#4B5563" text-anchor="middle">- 站点初筛</text>
  <text x="330" y="459" font-size="9.5" fill="#4B5563" text-anchor="middle">- 电量与载重合规校验(10% buffer)</text>
  <text x="330" y="471" font-size="9.5" fill="#4B5563" text-anchor="middle">- 3种方案(极速/经济/错峰)生成</text>

  <!-- LocalFormulaRouteImpl -->
  <rect x="445" y="415" width="150" height="50" rx="3" fill="#FFFFFF" stroke="#6B7280" stroke-width="1"/>
  <text x="520" y="435" font-size="10.5" font-weight="bold" fill="#111827" text-anchor="middle">LocalFormulaRouteImpl</text>
  <text x="520" y="453" font-size="9.5" fill="#4B5563" text-anchor="middle">(Haversine + 折线系数)</text>

  <!-- TrackingService -->
  <rect x="610" y="415" width="150" height="58" rx="3" fill="#FFFFFF" stroke="#6B7280" stroke-width="1"/>
  <text x="685" y="433" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">TrackingService</text>
  <text x="685" y="449" font-size="9.5" fill="#4B5563" text-anchor="middle">- 方案A按需时间坐标插值</text>
  <text x="685" y="463" font-size="9.5" fill="#4B5563" text-anchor="middle">- 关键阶段事件审计落库</text>

  <!-- [可扩展] MapApiRouteImpl -->
  <rect x="770" y="415" width="85" height="50" rx="3" fill="#FFFFFF" stroke="#6B7280" stroke-width="1"/>
  <text x="812" y="438" font-size="10" fill="#4B5563" text-anchor="middle">"[可扩展]"</text>
  <text x="812" y="454" font-size="9" fill="#6B7280" text-anchor="middle">MapApi</text>

  <!-- OrderService -->
  <rect x="865" y="415" width="125" height="50" rx="3" fill="#FFFFFF" stroke="#6B7280" stroke-width="1"/>
  <text x="927" y="435" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">OrderService</text>
  <text x="927" y="453" font-size="9.5" fill="#4B5563" text-anchor="middle">- 订单生命周期与状态机</text>

  <!-- UserService -->
  <rect x="1000" y="415" width="70" height="50" rx="3" fill="#FFFFFF" stroke="#6B7280" stroke-width="1"/>
  <text x="1035" y="435" font-size="10.5" font-weight="bold" fill="#111827" text-anchor="middle">UserService</text>
  <text x="1035" y="453" font-size="9" fill="#4B5563" text-anchor="middle">- 注册/登录</text>

  <!-- Row 2 in Services: RouteService interface & MockPaymentService -->
  <rect x="360" y="505" width="220" height="55" rx="3" fill="#FFFFFF" stroke="#6B7280" stroke-width="1"/>
  <text x="470" y="527" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">&lt;&lt;interface&gt;&gt; RouteService</text>
  <text x="470" y="546" font-size="10" fill="#4B5563" text-anchor="middle">- 路径节点与距离耗时计算</text>

  <rect x="740" y="505" width="220" height="55" rx="3" fill="#FFFFFF" stroke="#6B7280" stroke-width="1"/>
  <text x="850" y="525" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">MockPaymentService</text>
  <text x="850" y="540" font-size="9.5" fill="#4B5563" text-anchor="middle">- 模拟扣款与流水生成</text>
  <text x="850" y="552" font-size="9.5" fill="#4B5563" text-anchor="middle">- @Transactional原子锁车</text>

  <!-- Controllers down to Services arrows -->
  <line x1="145" y1="339" x2="145" y2="415" stroke="#1E3A8A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="345" y1="339" x2="345" y2="415" stroke="#1E3A8A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="545" y1="339" x2="650" y2="415" stroke="#1E3A8A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="735" y1="339" x2="900" y2="415" stroke="#1E3A8A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="920" y1="339" x2="1025" y2="415" stroke="#1E3A8A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Inside Services connections -->
  <path d="M 330 473 L 330 532 L 360 532" fill="none" stroke="#4B5563" stroke-width="1.2" marker-end="url(#arrow-gray)"/>
  <path d="M 520 465 L 520 505" fill="none" stroke="#4B5563" stroke-width="1.2" stroke-dasharray="3"/>
  <path d="M 812 465 L 812 485 L 580 485 L 580 520" fill="none" stroke="#4B5563" stroke-width="1.2" stroke-dasharray="3"/>
  <path d="M 927 465 L 927 505" fill="none" stroke="#4B5563" stroke-width="1.2" marker-end="url(#arrow-gray)"/>

  <!-- 5. 数据访问层 (Spring Data JPA Repositories) -->
  <rect x="40" y="615" width="1040" height="90" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <rect x="40" y="615" width="1040" height="24" rx="4" fill="#F3F4F6" stroke="#333333" stroke-width="1.5"/>
  <text x="560" y="631" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">数据访问层 (Spring Data JPA Repositories)</text>

  <!-- 6 Repositories -->
  <rect x="60" y="648" width="140" height="42" rx="3" fill="#FFFFFF" stroke="#6B7280" stroke-width="1"/>
  <text x="130" y="674" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">StationRepository</text>

  <rect x="230" y="648" width="140" height="42" rx="3" fill="#FFFFFF" stroke="#6B7280" stroke-width="1"/>
  <text x="300" y="674" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">OrderRepository</text>

  <rect x="400" y="648" width="140" height="42" rx="3" fill="#FFFFFF" stroke="#6B7280" stroke-width="1"/>
  <text x="470" y="674" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">VehicleRepository</text>

  <rect x="570" y="648" width="170" height="42" rx="3" fill="#FFFFFF" stroke="#6B7280" stroke-width="1"/>
  <text x="655" y="674" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">TrackingEventRepository</text>

  <rect x="770" y="648" width="140" height="42" rx="3" fill="#FFFFFF" stroke="#6B7280" stroke-width="1"/>
  <text x="840" y="674" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">PaymentRepository</text>

  <rect x="935" y="648" width="130" height="42" rx="3" fill="#FFFFFF" stroke="#6B7280" stroke-width="1"/>
  <text x="1000" y="674" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">UserRepository</text>

  <!-- Service to Repositories lines -->
  <line x1="135" y1="465" x2="135" y2="648" stroke="#1E3A8A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 280 473 L 280 590 L 170 590 L 170 648" fill="none" stroke="#1E3A8A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 380 473 L 380 590 L 470 590 L 470 648" fill="none" stroke="#1E3A8A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 685 473 L 685 648" fill="none" stroke="#1E3A8A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 910 465 L 910 590 L 330 590 L 330 648" fill="none" stroke="#1E3A8A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 850 560 L 850 648" fill="none" stroke="#1E3A8A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 1035 465 L 1035 648" fill="none" stroke="#1E3A8A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 6. 持久化层 (MySQL / PostgreSQL) -->
  <rect x="180" y="730" width="760" height="95" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <rect x="180" y="730" width="760" height="24" rx="4" fill="#F3F4F6" stroke="#333333" stroke-width="1.5"/>
  <text x="560" y="746" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">持久化层 (MySQL / PostgreSQL)</text>

  <!-- 6 DB Cylinders -->
  <!-- stations: center x = 230 -->
  <g transform="translate(195, 765)">
    <rect x="0" y="4" width="75" height="34" rx="3" fill="#F9FAFB" stroke="#6B7280" stroke-width="1"/>
    <ellipse cx="37.5" cy="4" rx="37.5" ry="6" fill="#E5E7EB" stroke="#6B7280" stroke-width="1"/>
    <ellipse cx="37.5" cy="38" rx="37.5" ry="6" fill="#F9FAFB" stroke="#6B7280" stroke-width="1"/>
    <text x="37.5" y="24" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle">stations</text>
  </g>

  <!-- orders: center x = 350 -->
  <g transform="translate(315, 765)">
    <rect x="0" y="4" width="75" height="34" rx="3" fill="#F9FAFB" stroke="#6B7280" stroke-width="1"/>
    <ellipse cx="37.5" cy="4" rx="37.5" ry="6" fill="#E5E7EB" stroke="#6B7280" stroke-width="1"/>
    <ellipse cx="37.5" cy="38" rx="37.5" ry="6" fill="#F9FAFB" stroke="#6B7280" stroke-width="1"/>
    <text x="37.5" y="24" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle">orders</text>
  </g>

  <!-- vehicles: center x = 470 -->
  <g transform="translate(435, 765)">
    <rect x="0" y="4" width="75" height="34" rx="3" fill="#F9FAFB" stroke="#6B7280" stroke-width="1"/>
    <ellipse cx="37.5" cy="4" rx="37.5" ry="6" fill="#E5E7EB" stroke="#6B7280" stroke-width="1"/>
    <ellipse cx="37.5" cy="38" rx="37.5" ry="6" fill="#F9FAFB" stroke="#6B7280" stroke-width="1"/>
    <text x="37.5" y="24" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle">vehicles</text>
  </g>

  <!-- tracking_events: center x = 600 -->
  <g transform="translate(545, 765)">
    <rect x="0" y="4" width="110" height="34" rx="3" fill="#F9FAFB" stroke="#6B7280" stroke-width="1"/>
    <ellipse cx="55" cy="4" rx="55" ry="6" fill="#E5E7EB" stroke="#6B7280" stroke-width="1"/>
    <ellipse cx="55" cy="38" rx="55" ry="6" fill="#F9FAFB" stroke="#6B7280" stroke-width="1"/>
    <text x="55" y="24" font-size="10.5" font-weight="bold" fill="#1F2937" text-anchor="middle">tracking_events</text>
  </g>

  <!-- payments: center x = 730 -->
  <g transform="translate(695, 765)">
    <rect x="0" y="4" width="85" height="34" rx="3" fill="#F9FAFB" stroke="#6B7280" stroke-width="1"/>
    <ellipse cx="42.5" cy="4" rx="42.5" ry="6" fill="#E5E7EB" stroke="#6B7280" stroke-width="1"/>
    <ellipse cx="42.5" cy="38" rx="42.5" ry="6" fill="#F9FAFB" stroke="#6B7280" stroke-width="1"/>
    <text x="42.5" y="24" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle">payments</text>
  </g>

  <!-- users: center x = 850 -->
  <g transform="translate(825, 765)">
    <rect x="0" y="4" width="75" height="34" rx="3" fill="#F9FAFB" stroke="#6B7280" stroke-width="1"/>
    <ellipse cx="37.5" cy="4" rx="37.5" ry="6" fill="#E5E7EB" stroke="#6B7280" stroke-width="1"/>
    <ellipse cx="37.5" cy="38" rx="37.5" ry="6" fill="#F9FAFB" stroke="#6B7280" stroke-width="1"/>
    <text x="37.5" y="24" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle">users</text>
  </g>

  <!-- Repo down to DB arrows (clean vertical lines) -->
  <line x1="130" y1="690" x2="232" y2="765" stroke="#1E3A8A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="300" y1="690" x2="352" y2="765" stroke="#1E3A8A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="470" y1="690" x2="472" y2="765" stroke="#1E3A8A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="655" y1="690" x2="600" y2="765" stroke="#1E3A8A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="840" y1="690" x2="737" y2="765" stroke="#1E3A8A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="1000" y1="690" x2="862" y2="765" stroke="#1E3A8A" stroke-width="1.2" marker-end="url(#arrow)"/>
</svg>